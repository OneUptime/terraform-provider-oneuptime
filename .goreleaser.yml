# GoReleaser config for Terraform Provider
# Used for parallel cross-compilation during CI builds
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

env:
  - CGO_ENABLED=0

builds:
  - binary: terraform-provider-oneuptime
    main: ./
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
      - solaris
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: solaris
        goarch: "386"
      - goos: solaris
        goarch: arm
      - goos: solaris
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - format: zip
    name_template: "terraform-provider-oneuptime_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "terraform-provider-oneuptime_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sig"
      - "${artifact}"

release:
  disable: true  # We handle release creation separately

changelog:
  disable: true